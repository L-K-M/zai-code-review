name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed bundle
        run: |
          git diff --exit-code -- dist/
          test -z "$(git status --porcelain --untracked-files=all -- dist/)"

      # dist/ ships third-party code, so its notices must ship with it: the
      # generator's header, llhttp (WebAssembly inside undici) and the webpack
      # runtime that ncc emits.
      - name: Verify bundled notices
        run: |
          test -s dist/licenses.txt
          grep -q '^Third-party notices for zai-code-review$' dist/licenses.txt
          grep -q 'Copyright Fedor Indutny' dist/licenses.txt
          grep -q 'Copyright JS Foundation and other contributors' dist/licenses.txt

      # Manifests must state the root LICENSE (MIT); the action is not on npm.
      - name: Check license metadata
        run: |
          node -e "
            const pkg = require('./package.json');
            const lock = require('./package-lock.json');
            if (pkg.license !== 'MIT' || pkg.private !== true || lock.packages[''].license !== 'MIT') {
              console.error('package.json and package-lock.json must state license MIT; package.json private');
              process.exit(1);
            }
          "
